name: Firebase Admin Module Test

on:
  push:
    branches:
      - fix/firebase-admin-esm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check installed versions
        run: npm ls firebase-admin jwks-rsa jose

      - name: Test Firebase Admin imports
        run: |
          node -e "require('firebase-admin/app'); require('firebase-admin/auth'); console.log('Firebase Admin imports OK')"

      - name: Test JWKS-RSA imports
        run: |
          node -e "require('jwks-rsa'); console.log('JWKS-RSA imports OK')"

      - name: Test Next.js Webpack build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "naya-build-test.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "naya-build-test"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "naya-build-test.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:abcdef1234567890abcdef"
        run: npm run build
      - name: Test compiled Firebase Admin API
        run: |
          node -e "const fs = require('fs'); const p = '.next/server/app/api/member/consent/route.js'; if (!fs.existsSync(p)) { console.error('API route not found'); process.exit(1); } require('./' + p); console.log('Compiled consent API module loaded successfully');"
